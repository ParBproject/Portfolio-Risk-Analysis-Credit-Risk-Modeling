name: Credit risk analytics quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Lint critical errors
        run: ruff check app.py src tests --select E4,E7,E9,F

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests

      - name: Run regression and dashboard smoke tests
        run: python -m pytest -q

      - name: Verify risk analytics imports
        run: python -c "import src.risk_analytics"
